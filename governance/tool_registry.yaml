tools:
  - name: memory.semantic_search
    scope: memory:read
    requires_approval: false
    cost_class: low
    max_runtime_ms: 800
    max_memory_mb: 256
    network_policy: none
    filesystem_policy: none

  - name: jobs.enqueue_embed
    scope: docs:ingest
    requires_approval: false
    cost_class: med
    max_runtime_ms: 500
    max_memory_mb: 128
    network_policy: none
    filesystem_policy: none

  - name: finance.write_transaction
    scope: finance:write
    requires_approval: true
    cost_class: high
    max_runtime_ms: 1200
    max_memory_mb: 256
    network_policy: none
    filesystem_policy: limited

  - name: idealab.capture_idea
    scope: ideas:write
    requires_approval: false
    cost_class: low
    max_runtime_ms: 800
    max_memory_mb: 128
    network_policy: none
    filesystem_policy: none

  - name: idealab.list_ideas
    scope: ideas:read
    requires_approval: false
    cost_class: low
    max_runtime_ms: 500
    max_memory_mb: 64
    network_policy: none
    filesystem_policy: none

  - name: idealab.evaluate_idea
    scope: ideas:read
    requires_approval: false
    cost_class: med
    max_runtime_ms: 1200
    max_memory_mb: 128
    network_policy: none
    filesystem_policy: none

  - name: idealab.plan_experiment
    scope: ideas:write
    requires_approval: false
    cost_class: med
    max_runtime_ms: 1200
    max_memory_mb: 128
    network_policy: none
    filesystem_policy: none

  - name: idealab.log_experiment_result
    scope: ideas:write
    requires_approval: false
    cost_class: low
    max_runtime_ms: 800
    max_memory_mb: 128
    network_policy: none
    filesystem_policy: none

  - name: timelab.capture_task
    scope: time:write
    input_schema: {type: object, required: [title]}
    output_schema: {type: object, required: [id]}
    requires_approval: false
    cost_class: low
    max_runtime_ms: 800
    max_memory_mb: 128
    network_policy: none
    filesystem_policy: none

  - name: timelab.list_tasks
    scope: time:read
    input_schema: {type: object}
    output_schema: {type: array}
    requires_approval: false
    cost_class: low
    max_runtime_ms: 600
    max_memory_mb: 128
    network_policy: none
    filesystem_policy: none

  - name: timelab.update_task
    scope: time:write
    input_schema: {type: object, required: [task_id]}
    output_schema: {type: object, required: [id, updated]}
    requires_approval: false
    cost_class: low
    max_runtime_ms: 800
    max_memory_mb: 128
    network_policy: none
    filesystem_policy: none

  - name: timelab.capture_goal
    scope: time:write
    input_schema: {type: object, required: [title]}
    output_schema: {type: object, required: [id]}
    requires_approval: false
    cost_class: low
    max_runtime_ms: 800
    max_memory_mb: 128
    network_policy: none
    filesystem_policy: none

  - name: timelab.list_goals
    scope: time:read
    input_schema: {type: object}
    output_schema: {type: array}
    requires_approval: false
    cost_class: low
    max_runtime_ms: 600
    max_memory_mb: 128
    network_policy: none
    filesystem_policy: none

  - name: timelab.weekly_review
    scope: time:read
    input_schema: {type: object, properties: {persist: {type: boolean}}}
    output_schema: {type: object, required: [summary, persisted]}
    requires_approval: false
    cost_class: med
    max_runtime_ms: 1500
    max_memory_mb: 192
    network_policy: none
    filesystem_policy: none

  - name: financelab.import_preview_csv
    scope: docs:ingest
    input_schema: {type: object, required: [source_doc_id, mapping]}
    output_schema: {type: object, required: [import_id, payload_hash, summary]}
    requires_approval: false
    cost_class: med
    max_runtime_ms: 2000
    max_memory_mb: 256
    network_policy: none
    filesystem_policy: none

  - name: financelab.list_transactions
    scope: finance:read
    input_schema: {type: object}
    output_schema: {type: object, required: [items]}
    requires_approval: false
    cost_class: low
    max_runtime_ms: 800
    max_memory_mb: 128
    network_policy: none
    filesystem_policy: none

  - name: financelab.spend_summary
    scope: finance:read
    input_schema: {type: object}
    output_schema: {type: object, required: [total, rows]}
    requires_approval: false
    cost_class: low
    max_runtime_ms: 1000
    max_memory_mb: 128
    network_policy: none
    filesystem_policy: none

  - name: financelab.commit_import
    scope: finance:write
    input_schema: {type: object, required: [import_id]}
    output_schema: {type: object, required: [status]}
    requires_approval: true
    cost_class: high
    max_runtime_ms: 3000
    max_memory_mb: 256
    network_policy: none
    filesystem_policy: none

  - name: financelab.write_transaction
    scope: finance:write
    input_schema: {type: object, required: [ts, amount]}
    output_schema: {type: object, required: [status]}
    requires_approval: true
    cost_class: high
    max_runtime_ms: 1500
    max_memory_mb: 256
    network_policy: none
    filesystem_policy: none
