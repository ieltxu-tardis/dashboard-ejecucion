<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Dashboard Personal — Sistema de Ejecución</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header>
    <h1>Dashboard Personal</h1>
    <p id="meta"></p>
    <nav id="quicklinks"></nav>

    <div class="scopebar">
      <label for="scopeSelect">Scope:</label>
      <select id="scopeSelect">
        <option value="all">all</option>
        <option value="work">work</option>
        <option value="personal">personal</option>
        <option value="general">general</option>
      </select>
    </div>
  </header>

  <main class="grid">
    <section class="card card-primary" id="nextaction"><h2>Control Tower · Siguiente acción</h2><ul></ul></section>
    <section class="card" id="system"><h2>Sistema</h2><ul></ul></section>
    <section class="card" id="scopeview"><h2>Scope · Estructura</h2><ul></ul></section>
    <section class="card" id="scopechangelog"><h2>Scope · Changelog</h2><ul></ul></section>
    <section class="card" id="liveops"><h2>Live Ops</h2><ul></ul></section>
  </main>

  <footer>
    <small>Fuente: dashboard/data.json</small>
  </footer>

  <script src="app.js"></script>
</body>
</html>
